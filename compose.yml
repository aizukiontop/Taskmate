services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: taskmate
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  server:
    build: ./server
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:devpassword@db:5432/taskmate
      CORS_ORIGINS: http://localhost:5173
      NODE_ENV: development
    ports:
      - "3000:3000"

  client:
    build: ./client
    depends_on:
      - server
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:5173"

volumes:
  pg_data:
